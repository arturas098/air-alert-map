name: diag-ukrainealarm
# Vienkartinė diagnostika: pilnas ukrainealarm API atsakymas (be rakto) → šaka `diag`
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-ua.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Užklausos
        env:
          KEY: ${{ secrets.UKRAINEALARM_KEY }}
        run: |
          {
            echo "laikas: $(date -u +%FT%TZ)"
            echo "runner IP: $(curl -s https://api.ipify.org)"
            echo "rakto ilgis: ${#KEY}, formatas: $(echo "$KEY" | sed -E 's/[0-9a-f]/x/g')"
            for ep in alerts/status alerts regions; do
              echo; echo "===== /api/v3/$ep"
              curl -sS -m 20 -i -H "Authorization: $KEY" "https://api.ukrainealarm.com/api/v3/$ep" | head -c 1500
              echo; sleep 3
            done
            echo; echo "===== be rakto (/api/v3/alerts/status)"
            curl -sS -m 20 -i "https://api.ukrainealarm.com/api/v3/alerts/status" | head -c 800
          } > diag.txt 2>&1
          sed -i "s/$KEY/***RAKTAS***/g" diag.txt
          cat diag.txt
      - name: Įrašyti į šaką diag
        run: |
          mkdir out && mv diag.txt out/ && cd out
          git init -q -b diag && git add diag.txt
          git -c user.name=air-alert-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm diag
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:diag
