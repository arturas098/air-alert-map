name: collect-alerts

# GitHub „schedule“ paleidžia nereguliariai, todėl vienas darbas veikia ~55 min ir tikrina
# šaltinius kas 90 s (collector/loop.py). Grafikas tik vėl įjungia darbą, jei ankstesnis baigėsi.
# alerts.json ir history.json publikuojami į šaką `data` (force-push, be istorijos).
# GitHub „schedule“ realiai paleidžia retai (kartais kas kelias valandas), todėl ciklas pasibaigęs
# pats paleidžia kitą per workflow_dispatch (GITHUB_TOKEN tai leidžia). Grafikas lieka kaip atsarga.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["collector/**", "data/regions.json", ".github/workflows/collect.yml"]

permissions:
  contents: write
  actions: write      # kad ciklas pasibaigęs galėtų paleisti kitą

concurrency:
  group: collect-alerts
  cancel-in-progress: ${{ github.event_name == 'push' }}   # naujas kodas pakeičia seną ciklą; grafikas – ne

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nuolatinis surinkimas (~55 min)
        run: python3 -u collector/loop.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTERVAL: "90"
          DURATION: "3300"
          UKRAINEALARM_KEY: ${{ secrets.UKRAINEALARM_KEY }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
      - name: Paleisti kitą ciklą
        if: ${{ !cancelled() }}   # ne atšauktas (naujas push pats tęs grandinę)
        run: gh workflow run collect.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
