name: collect-alerts

on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub leidžia min. kas 5 min (realiai gali vėluoti)
  workflow_dispatch: {}       # rankinis paleidimas iš Actions skirtuko

permissions:
  contents: write

concurrency:
  group: collect-alerts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Surinkti įspėjimus
        run: python3 collector/collector.py
        env:   # nebūtina; be raktų Ukrainai naudojamas viešas agregatorius
          UKRAINEALARM_KEY: ${{ secrets.UKRAINEALARM_KEY }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
      - name: Commit, jei pasikeitė (arba kas valandą gyvybės ženklas)
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, os
          from datetime import datetime, timezone
          new = json.load(open("alerts.json"))
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:alerts.json"]))
          except Exception:
              old = None
          strip = lambda d: {k: v for k, v in d.items() if k != "_meta"} if d else None
          changed = strip(new) != strip(old)
          stale = True
          if old and old.get("_meta", {}).get("checked"):
              age = datetime.now(timezone.utc) - datetime.fromisoformat(old["_meta"]["checked"])
              stale = age.total_seconds() > 3600
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DO_COMMIT={'1' if (changed or stale) else '0'}\n")
          print("changed:", changed, "stale:", stale)
          PY
      - name: Push
        if: env.DO_COMMIT == '1'
        run: |
          git config user.name "air-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          git commit -m "alerts: $(date -u +%H:%MZ)" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
