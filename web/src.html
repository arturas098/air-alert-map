<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Oro pavojus · Baltija</title>
<style>
:root{
  --bg:#0a0a0b; --ink:#e9e6df; --ink2:#a9a59c; --ink3:#5d5a55; --ink4:#2a2927;
  --white:#f2f0ea; --teal:#22D3C5; --yellow:#ffd23f; --red:#ff3b30; --grey:#7c7a75;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
#base{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform;display:block}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.6}
/* header */
.top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;pointer-events:none;
  background:linear-gradient(var(--bg) 30%,transparent)}
.top h1{font-size:11px;letter-spacing:.24em;white-space:nowrap;font-weight:600;text-transform:uppercase}
.top .sub{font-size:10px;color:var(--ink2);letter-spacing:.12em}
.top .sp{flex:1}
.chip{pointer-events:auto;font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  background:rgba(10,10,11,.6);border:1px solid var(--ink3);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.live{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.dot.stale{background:#ff9f0a;box-shadow:0 0 8px #ff9f0a}
.top .sub.warn{color:#ff9f0a}
/* cards */
.cards{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  background:linear-gradient(transparent,var(--bg) 40%)}
.cards::-webkit-scrollbar{display:none}
.card{--c:var(--grey);flex:0 0 min(78vw,300px);scroll-snap-align:center;border-radius:16px;padding:12px 14px 12px;
  border:2px solid var(--c);background:color-mix(in srgb,var(--c) 13%,rgba(10,10,11,.72));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 18px -4px color-mix(in srgb,var(--c) 70%,transparent);cursor:pointer;transition:transform .2s}
.card.sel{transform:translateY(-4px)}
.card[data-l="red"]{--c:var(--red);animation:pulse 1.6s ease-in-out infinite}
.card[data-l="yellow"]{--c:var(--yellow)}
.card[data-l="white"]{--c:var(--white)}
.card[data-l="none"]{--c:var(--grey)}
.card[data-k="weather"],.card[data-k="chem"],.card[data-k="other"]{--c:var(--teal);animation:none}
.card[data-k="weather"][data-l="red"]{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 30px 2px color-mix(in srgb,var(--c) 75%,transparent)}}
.card .row{display:flex;align-items:baseline;gap:8px}
.card .cc{font-size:10px;letter-spacing:.2em;color:var(--c);border:1px solid var(--c);border-radius:6px;padding:1px 5px}
.card .nm{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.card .st{margin-top:8px;font-size:15px;font-weight:700;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.card .kd{display:inline-block;margin-top:5px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);border:1px dashed var(--c);border-radius:6px;padding:2px 6px}
.card .ds{margin-top:4px;font-size:11.5px;line-height:1.45;color:var(--ink);opacity:.88}
.card .mt{margin-top:8px;font-size:9.5px;color:var(--ink2);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
@media (min-width:900px) and (orientation:landscape){
  .cards{left:auto;top:64px;width:340px;flex-direction:column;overflow-y:auto;overflow-x:hidden;background:none;padding:8px 16px 16px}
  .card{flex:0 0 auto}
}
/* sluoksniai, garsas */
.tools{position:fixed;right:12px;top:calc(46px + env(safe-area-inset-top));display:flex;gap:6px;align-items:center;z-index:5}
.seg{display:flex;border:1px solid var(--ink3);border-radius:999px;overflow:hidden;background:rgba(10,10,11,.7)}
.seg button{font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:none;border:0;padding:6px 9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
#bell{font-size:12px;padding:4px 9px;letter-spacing:.06em}
#bell.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
/* pasenę duomenys – viskas išblukinama */
body.stale #map g, body.stale .card{filter:grayscale(.85);opacity:.55}
body.stale .card{animation:none!important}
/* legend */
.legend{position:fixed;left:14px;top:calc(84px + env(safe-area-inset-top));font-size:9.5px;letter-spacing:.1em;color:var(--ink2);
  display:flex;flex-direction:column;gap:4px;pointer-events:none;text-transform:uppercase;background:rgba(10,10,11,.7);padding:7px 9px;border-radius:10px;border:1px solid #2a2927}
.legend i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:6px;vertical-align:0;border:1.5px solid}
/* detalių langas */
#detail{--c:var(--grey);position:fixed;z-index:20;left:14px;top:50%;transform:translateY(-50%);width:min(380px,calc(100vw - 28px));
  max-height:max(260px,calc(100vh - 420px));overflow:auto;border-radius:18px;border:2px solid var(--c);
  background:color-mix(in srgb,var(--c) 10%,rgba(10,10,11,.9));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 0 1px #000,0 0 26px -6px color-mix(in srgb,var(--c) 70%,transparent);padding:16px 16px 14px;display:none}
#detail.open{display:block}
#detail .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--ink2);font:inherit;font-size:20px;cursor:pointer;padding:4px 8px}
#detail h2{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:baseline}
#detail .st{margin-top:10px;font-size:18px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
#detail .kd{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);border:1px dashed var(--c);border-radius:6px;padding:2px 7px}
#detail .sec{margin-top:14px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);border-top:1px solid #2a2927;padding-top:10px}
#detail .it{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ic) 55%,transparent);background:color-mix(in srgb,var(--ic) 8%,transparent)}
#detail .it b{display:block;font-size:12.5px;color:var(--ic)}
#detail .it span{display:block;font-size:11px;line-height:1.45;color:var(--ink);opacity:.9;margin-top:2px}
#detail .it i{display:block;font-style:normal;font-size:10px;color:var(--ink2);margin-top:3px}
#detail .src{font-size:11px;line-height:1.7;color:var(--ink)}
#detail .src a{color:var(--ink)}
#detail .ok{color:#3ddc84}#detail .bad{color:#ff8a80}
@media (max-width:899px),(orientation:portrait){#detail{left:10px;right:10px;width:auto;top:calc(218px + env(safe-area-inset-top));transform:none;max-height:34vh}}
</style>
</head>
<body>
<canvas id="base"></canvas>
<svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="grain"></div>

<div class="top">
  <div><h1>Oro pavojus · Baltija</h1><div class="sub" id="upd">kraunama…</div></div>
  <div class="sp"></div>
  <button class="chip" id="demo">Demo</button>
  <span class="chip" style="pointer-events:none"><span class="dot" id="live"></span><span id="src">offline</span></span>
</div>

<div class="tools">
  <div class="seg" id="layers" role="group" aria-label="Sluoksnis">
    <button data-l="all">Visi</button><button data-l="air">✈ Kariniai</button><button data-l="weather">☂ Orai</button>
  </div>
  <button class="chip" id="bell" title="Garsas ir pranešimas, kai atsiranda naujas oro pavojus">🔕</button>
</div>

<div class="legend">
  <div><i style="border-color:var(--red);background:rgba(255,59,48,.25)"></i>Oro pavojus</div>
  <div><i style="border-color:var(--yellow);background:rgba(255,210,63,.2)"></i>Tikėtinas pavojus</div>
  <div><i style="border-color:var(--white);background:rgba(255,255,255,.12)"></i>Pavojaus nėra</div>
  <div><i style="border-color:var(--grey)"></i>Nenustatyta</div>
  <div><i style="border-color:var(--teal);background:rgba(34,211,197,.18)"></i>Stichija / orai</div>
</div>

<div class="cards" id="cards"></div>
<div id="detail" role="dialog" aria-label="Pavojaus detalės"></div>

<script>/*D3*/</script>
<script>/*TOPOJSON*/</script>
<script>
const TOPO = /*MAPDATA*/;

/* ---------- šalys ---------- */
const COUNTRIES = [
  {id:"LTU", cc:"LT", nm:"Lietuva",      src:"lt72.lt (PAGD) · LRT"},
  {id:"LVA", cc:"LV", nm:"Latvija",      src:"NBS · lvportals.lv"},
  {id:"EST", cc:"EE", nm:"Estija",       src:"kriis.ee (EE-ALARM) · ERR"},
  {id:"FIN", cc:"FI", nm:"Suomija",      src:"Yle Teksti-TV 112 · FMI"},
  {id:"POL", cc:"PL", nm:"Lenkija",      src:"gov.pl/rcb (Alert RCB)"},
  {id:"UKR", cc:"UA", nm:"Ukraina",      src:"ukrainealarm.com · alerts.in.ua"},
  {id:"KGD", cc:"KG", nm:"Karaliaučius", hidden:true},
  {id:"BLR", cc:"BY", nm:"Baltarusija", hidden:true},
  {id:"RUS", cc:"RU", nm:"Rusija", hidden:true},
];
const LEVEL_TXT = {red:"Oro pavojus", yellow:"Tikėtinas oro pavojus", white:"Pavojaus nėra", none:"Nenustatyta"};
const LEVEL_ALT = {red:"Pavojus", yellow:"Įspėjimas"};
const KIND = {air:"✈ Oro grėsmė", weather:"☂ Stichija", chem:"☣ Tarša / avarija", other:"! Kita"};
const COLOR = {red:"#ff3b30", yellow:"#ffd23f", white:"#f2f0ea", none:"#7c7a75", teal:"#22D3C5"};
// oro pavojus – valstybinis kodas (balta/geltona/raudona); stichija ir kita – žydra
const isAir = s => !s.kind || s.kind==="air";
const tone = s => (s.level==="red"||s.level==="yellow") && !isAir(s) ? "teal" : s.level;

const BASE = Object.fromEntries(COUNTRIES.map(c=>[c.id,{level:"none",text:"Duomenų nėra arba šaltinis nepasiekiamas.",time:null}]));
const DEMOS = [
  {LTU:{level:"yellow",kind:"air",text:"Tikėtinas oro pavojus (GELTONA), galbūt dronas. Nusimatykite saugią vietą ar priedangą."},
   LVA:{level:"white",text:"Aktyvių perspėjimų nėra."}, EST:{level:"white",text:"Aktyvių perspėjimų nėra."},
   FIN:{level:"white",text:"Aktyvių vaaratiedote nėra."}, POL:{level:"yellow",kind:"air",text:"Alert RCB: Lenkijos aviacija ore, sekite pranešimus."}},
  {LTU:{level:"red",kind:"air",text:"ORO PAVOJUS (RAUDONA). Nedelsdami eikite į saugią vietą ar priedangą. Rekomendacijos: lt72.lt"},
   LVA:{level:"yellow",kind:"weather",text:"Oranžais brīdinājums: stiprs vējš, brāzmas līdz 25 m/s. Sekite 112.lv."}, EST:{level:"white",text:"Aktyvių perspėjimų nėra."},
   FIN:{level:"yellow",kind:"air",text:"Vaaratiedote: ilmauhka, Kaakkois-Suomi. Mene sisätiloihin."}, POL:{level:"white",text:"Aktyvių perspėjimų nėra."},
   UKR:{level:"red",kind:"air",text:"Oro pavojus 6 iš 27 sričių.",regions:{"UA-63":"red","UA-59":"red","UA-14":"red","UA-23":"red","UA-12":"red","UA-74":"red"}}},
];

/* ---------- žemėlapis ----------
   Pagrindas (jūra, sausuma, keliai, upės, sienos, užrašai) piešiamas į <canvas> vieną kartą.
   Per zoom/pan canvas tik pastumiamas CSS transform'u, o pabaigus perpiešiamas ryškiai.
   SVG lieka tik pavojų sluoksniui (≤5 kontūrai), todėl judėjimas lengvas. */
const svg = d3.select("#map");
const cv = document.getElementById("base"), ctx = cv.getContext("2d");
const W = () => innerWidth, H = () => innerHeight;
// plati išdėstymo schema (kortelės dešinėje) tik gulsčiam ekranui; telefonui „desktop“ režime – kaip mobiliam
const isWide = () => W()>=900 && W()>H();
const DPR = () => Math.min(devicePixelRatio||1, 2);
const BG="#0a0a0b", INK="233,230,223";
const defs = svg.append("defs");
function hatch(id,color,gap,w,op,ang){
  defs.append("pattern").attr("id",id).attr("patternUnits","userSpaceOnUse").attr("width",gap).attr("height",gap)
    .attr("patternTransform",`rotate(${ang})`)
    .append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",gap).attr("stroke",color).attr("stroke-width",w).attr("stroke-opacity",op);
}
for(const k of ["red","yellow","white","teal"]) hatch("h-"+k,COLOR[k],6,1.2,.55,45);

// popieriaus grūdas – maža triukšmo plytelė kaip CSS fonas (be SVG filtrų)
(()=>{const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");const d=x.createImageData(128,128);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*20;}
  x.putImageData(d,0,0);document.getElementById("grain").style.backgroundImage=`url(${c.toDataURL()})`;})();

const L = TOPO.objects;
const countries = topojson.feature(TOPO,L.c).features;
const rivers = topojson.feature(TOPO,L.rv).features;
const lakes = topojson.feature(TOPO,L.lk).features;
const roads = topojson.feature(TOPO,L.rd).features;
const rails = topojson.feature(TOPO,L.rl);
const places = topojson.feature(TOPO,L.pl).features;
const RSHAPES = {};   // sritys pagal ISO 3166-2 (kol kas naudoja Ukraina)
for(const f of topojson.feature(TOPO,L.r).features) if(f.properties.iso_3166_2) RSHAPES[f.properties.iso_3166_2]=f;
const land = topojson.merge(TOPO,L.c.geometries);
const inner = topojson.mesh(TOPO,L.c,(a,b)=>a!==b);
const regMesh = topojson.mesh(TOPO,L.r,(a,b)=>a!==b && a.properties.adm0_a3===b.properties.adm0_a3);

// Karaliaučių atskiriam nuo Rusijos
const rus = countries.find(f=>f.properties.ADM0_A3==="RUS");
const polys = rus.geometry.type==="MultiPolygon"?rus.geometry.coordinates:[rus.geometry.coordinates];
const isKgd = p=>{const c=d3.geoCentroid({type:"Polygon",coordinates:p});return c[0]<23 && c[1]<56;};
const SHAPES = {};
for(const f of countries) SHAPES[f.properties.ADM0_A3]=f;
SHAPES.KGD = {type:"Feature",properties:{ADM0_A3:"KGD"},geometry:{type:"MultiPolygon",coordinates:polys.filter(isKgd)}};
SHAPES.RUS = {type:"Feature",properties:{ADM0_A3:"RUS"},geometry:{type:"MultiPolygon",coordinates:polys.filter(p=>!isKgd(p))}};

const proj = d3.geoConicConformal().parallels([53,66]).rotate([-24,0]);
// pradinis vaizdas – visos stebimos šalys
const fitTo = {type:"FeatureCollection",features:["LTU","LVA","EST","FIN","POL","UKR","KGD"].map(k=>SHAPES[k])};
const path = d3.geoPath(proj);

const root = svg.append("g");
const gAlert=root.append("g"), gAlertEdge=root.append("g");

// Path2D talpykla – suskaičiuojama tik pasikeitus ekrano dydžiui
let P = null, LABELS = [];
const SEA=[["BALTIJOS  JŪRA",[19.3,56.2],0],["RYGOS ĮL.",[23.4,57.6],0],["SUOMIJOS  ĮLANKA",[25.5,59.85],-6],["BOTNIJOS  ĮLANKA",[20.6,62.4],-62]];
const LBL={UKR:[31.2,49.3],LTU:[24.1,55.55],LVA:[26.4,56.55],EST:[25.9,58.75],FIN:[26.5,64],POL:[20.2,52.6],BLR:[28,53.6],RUS:[31.5,57.2],KGD:[21.4,54.42]};
function build(){
  const pad = Math.min(W(),H())*.04;
  const bottom = isWide() ? 20 : 150, right = isWide() ? 340 : 0;
  proj.fitExtent([[pad,60],[W()-pad-right,H()-bottom]],fitTo);
  const P2 = g=>new Path2D(path(g)||"");
  P = {
    grat: P2(d3.geoGraticule().step([2,1])()), land: P2(land), reg: P2(regMesh), inner: P2(inner),
    roadsMaj: P2({type:"FeatureCollection",features:roads.filter(d=>d.properties.m===1)}),
    roadsMin: P2({type:"FeatureCollection",features:roads.filter(d=>d.properties.m!==1)}),
    rails: P2(rails), lakes: P2({type:"FeatureCollection",features:lakes}),
    rivers: d3.groups(rivers,d=>Math.min(9,d.properties.scalerank|0)).map(([r,fs])=>[r,P2({type:"FeatureCollection",features:fs})]),
  };
  const pl = places.filter(d=>d.properties.scalerank<=5 || ["LTU","LVA","EST"].includes(d.properties.adm0_a3)&&d.properties.scalerank<=7);
  LABELS = pl.map(d=>({p:proj(d.geometry.coordinates),t:d.properties.name,r:d.properties.scalerank,cap:d.properties.featurecla.includes("capital")}));
}
// štrichų raštai (canvas)
function pat(gap,w,a,ang){const c=document.createElement("canvas");const n=gap*4;c.width=c.height=n;const x=c.getContext("2d");
  x.strokeStyle=`rgba(${INK},${a})`;x.lineWidth=w;for(let i=-n;i<2*n;i+=gap){x.beginPath();x.moveTo(i,0);x.lineTo(i+n*Math.tan(ang),n);x.stroke();}
  return ctx.createPattern(c,"repeat");}
const PAT_LAND = pat(5,.5,.10,.6), PAT_LAKE = pat(3,.5,.22,-.6);

let T0 = d3.zoomIdentity;   // transformacija, kuria paskutinį kartą nupieštas canvas
function renderBase(t){
  const dpr=DPR(), w=W(), h=H();
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";}
  cv.style.transform=""; T0=t;
  const k=t.k, px=1/k;   // px – vienas ekrano pikselis žemėlapio koordinatėmis
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=BG; ctx.fillRect(0,0,w,h);
  ctx.setTransform(dpr*k,0,0,dpr*k,dpr*t.x,dpr*t.y);
  ctx.lineJoin="round"; ctx.lineCap="round";
  const S=(p2,a,lw,dash)=>{ctx.strokeStyle=`rgba(${INK},${a})`;ctx.lineWidth=lw*px;ctx.setLineDash(dash?dash.map(v=>v*px):[]);ctx.stroke(p2);};
  S(P.grat,.05,.6);
  // vandens linijos aplink krantą
  [38,31,25,20,15.5,12,9,6.5,4.5,3].forEach((r,i)=>{S(P.land,.07+i*.03,r*2);ctx.strokeStyle=BG;ctx.lineWidth=(r*2-1.1)*px;ctx.stroke(P.land);});
  ctx.setLineDash([]);
  ctx.fillStyle="#0f0f10"; ctx.fill(P.land);
  const m=new DOMMatrix().scale(px); PAT_LAND.setTransform(m); PAT_LAKE.setTransform(m);
  ctx.fillStyle=PAT_LAND; ctx.fill(P.land);
  S(P.reg,.16,.5,[2,2.5]);
  S(P.roadsMin,.11,.45); S(P.roadsMaj,.22,.7);
  S(P.rails,.2,.5); S(P.rails,.22,2.2,[.5,5]); ctx.setLineDash([]);
  for(const [r,p2] of P.rivers){ctx.strokeStyle="rgba(207,216,220,.35)";ctx.lineWidth=Math.max(.4,1.3-r*.1)*px;ctx.stroke(p2);}
  ctx.fillStyle=BG; ctx.fill(P.lakes); ctx.fillStyle=PAT_LAKE; ctx.fill(P.lakes); S(P.lakes,.5,.6);
  // sienos – dvigubas pieštukas
  S(P.inner,.55,1.1); S(P.land,.85,1);
  ctx.save(); ctx.translate(1.2*px,.8*px); S(P.inner,.3,.5); ctx.restore();
  ctx.save(); ctx.translate(-1*px,1.1*px); S(P.land,.25,.5); ctx.restore();
  // užrašai – ekrano koordinatėmis, kad liktų ryškūs ir nesididintų
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const mono = getComputedStyle(document.body).fontFamily;
  const txt=(s,x,y,size,a,opts={})=>{ctx.font=`${opts.w||400} ${opts.it?"italic ":""}${size}px ${opts.ff||mono}`;
    ctx.letterSpacing=(opts.ls||0)+"px"; ctx.textAlign=opts.al||"left";
    ctx.lineWidth=opts.sw||3; ctx.strokeStyle=BG; ctx.strokeText(s,x,y); ctx.fillStyle=opts.col||`rgba(${INK},${a})`; ctx.fillText(s,x,y);};
  SEA.forEach(([s,c,r])=>{const [x,y]=t.apply(proj(c));ctx.save();ctx.translate(x,y);ctx.rotate(r*Math.PI/180);
    txt(s,0,0,10,.45,{it:1,ls:3,al:"center",ff:"Georgia,serif",col:"rgba(207,216,220,.45)",sw:0});ctx.restore();});
  for(const l of LABELS){ if(l.r>4 && k<1.8) continue; const [x,y]=t.apply(l.p); if(x<-50||y<-20||x>w+20||y>h+20) continue;
    ctx.strokeStyle=`rgba(${INK},.9)`; ctx.lineWidth=1;
    if(l.cap){ctx.strokeRect(x-3,y-3,6,6);ctx.fillStyle=`rgba(${INK},1)`;ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill();}
    else{ctx.fillStyle=BG;ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();ctx.strokeStyle=`rgba(${INK},.7)`;ctx.lineWidth=.8;ctx.stroke();}
    txt(l.t,x+6,y+3,l.cap?10.5:8.5,l.cap?.95:.6,{ls:l.cap?.8:.2});
  }
  const ks=Math.max(.75,Math.min(1.6,Math.sqrt(k)));
  COUNTRIES.forEach(c=>{const [x,y]=t.apply(proj(LBL[c.id]));
    txt(c.nm.toUpperCase(),x,y,(c.id==="KGD"?9:13)*ks,c.hidden?.38:.9,{w:600,ls:5.5*ks,al:"center",sw:4});});
}
let raf=0, idle=0;
function onZoom(t){
  root.attr("transform",t);
  defs.selectAll("pattern").attr("patternTransform",`scale(${1/t.k}) rotate(45)`);   // štrichai lieka vienodo tankio
  // greitas kelias: tik pastumiam jau nupieštą canvas
  const s=t.k/T0.k; cv.style.transform=`translate(${t.x-T0.x*s}px,${t.y-T0.y*s}px) scale(${s})`;
  clearTimeout(idle); idle=setTimeout(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>renderBase(t));},140);
}
function draw(){ build(); limitZoom(); renderAlerts(); }
/* ---------- pavojų sluoksnis ---------- */
let STATE = structuredClone(BASE), demoIdx=-1, selected=null;
function renderAlerts(){
  gAlert.selectAll("*").remove(); gAlertEdge.selectAll("*").remove();
  COUNTRIES.filter(c=>!c.hidden).forEach(c=>{
    const s=V(c.id), lv=s.level, d=path(SHAPES[c.id]);
    const hit = gAlert.append("path").attr("d",d).attr("fill","transparent").style("cursor","pointer").on("click",()=>select(c.id));
    if(lv==="none") return;
    const hasReg = s.regions && Object.keys(s.regions).length;
    if(hasReg){               // sričių lygis: dažom sritis su pavojumi
      for(const [iso,rl] of Object.entries(s.regions)){ const f=RSHAPES[iso]; if(!f) continue; const rd=path(f);
        gAlert.append("path").attr("d",rd).attr("fill",COLOR[rl]).attr("fill-opacity",.16).attr("pointer-events","none");
        gAlert.append("path").attr("d",rd).attr("fill",`url(#h-${rl})`).attr("pointer-events","none");
        gAlertEdge.append("path").attr("d",rd).attr("fill","none").attr("stroke",COLOR[rl]).attr("stroke-opacity",.2).attr("stroke-width",7)
          .attr("pointer-events","none").attr("vector-effect","non-scaling-stroke");
        gAlertEdge.append("path").attr("d",rd).attr("fill","none").attr("stroke",COLOR[rl]).attr("stroke-width",1.6)
          .attr("pointer-events","none").attr("vector-effect","non-scaling-stroke");
      }
      if(s.regionsOnly!==false){   // visi įspėjimai pririšti prie sričių – šalį tik plonai apvedam
        gAlertEdge.append("path").attr("d",d).attr("fill","none").attr("stroke","#f2f0ea").attr("stroke-opacity",.5).attr("stroke-width",1.1)
          .attr("pointer-events","none").attr("vector-effect","non-scaling-stroke");
        return;
      }
    }
    const tn=tone(s), col=COLOR[tn];
    gAlert.append("path").attr("d",d).attr("fill",col).attr("fill-opacity",lv==="white"?.05:(tn==="teal"&&lv==="yellow"?.10:.16)).attr("pointer-events","none");
    if(lv!=="white") gAlert.append("path").attr("d",d).attr("fill",`url(#h-${tn})`).attr("fill-opacity",tn==="teal"&&lv==="yellow"?.6:1).attr("pointer-events","none");
    if(lv!=="white") gAlertEdge.append("path").attr("d",d).attr("fill","none").attr("stroke",col).attr("stroke-opacity",.22)
      .attr("stroke-width",9).attr("stroke-linejoin","round").attr("pointer-events","none").attr("vector-effect","non-scaling-stroke");
    const e=gAlertEdge.append("path").attr("d",d).attr("fill","none").attr("stroke",col)
      .attr("stroke-width",lv==="white"?1.2:2.4).attr("stroke-opacity",lv==="white"?.55:1).attr("stroke-linejoin","round")
      .attr("pointer-events","none").attr("vector-effect","non-scaling-stroke");
    if(lv==="red") e.append("animate").attr("attributeName","stroke-opacity").attr("values","1;.35;1").attr("dur",tn==="teal"?"3s":"1.6s").attr("repeatCount","indefinite");
  });
  if(selected){gAlertEdge.append("path").attr("d",path(SHAPES[selected])).attr("fill","none").attr("stroke","#fff")
    .attr("stroke-width",1).attr("stroke-dasharray","4 3").attr("vector-effect","non-scaling-stroke").attr("pointer-events","none");}
  renderCards();
}
const ORDER={red:0,yellow:1,white:2,none:3};
const RANKL={none:0,white:1,yellow:2,red:3};
/* ---------- sluoksniai: visi / kariniai / orai ---------- */
let LAYER="all";
try{ LAYER=localStorage.getItem("layer")||"all"; }catch(e){}
function V(id){
  const s=STATE[id]; if(!s || LAYER==="all") return s;
  const all = s.items || ((s.level==="red"||s.level==="yellow") ? [{...s, regions:Object.keys(s.regions||{})}] : []);
  const sel = all.filter(a => LAYER==="air" ? (a.kind||"air")==="air" : (a.kind||"air")!=="air");
  if(!sel.length){
    const ok = LAYER==="air" ? s.air==="ok" || (id==="UKR"&&s.level!=="none") || (demoIdx>=0)
                             : s.weather==="ok" || (demoIdx>=0&&id!=="UKR");
    return {...s, level: ok?"white":"none", kind:"", items:[], regions:null, regionsOnly:null, dateOnly:false,
      text: LAYER==="air" ? (ok?"Oro pavojaus nėra.":"Oro pavojaus būsena nenustatyta.")
                          : (ok?"Orų įspėjimų nėra.":(id==="UKR"?"Ukrainos orų įspėjimų nerenkame.":"Orų duomenų nėra."))};
  }
  sel.sort((a,b)=>RANKL[b.level]-RANKL[a.level]);
  const top=sel[0], regions={};
  for(const a of sel) for(const r of (a.regions||[])){ const t=(a.kind||"air")==="air"?a.level:"teal";
    const rk={teal:1,yellow:2,red:3}; if((rk[t]||0)>(rk[regions[r]]||0)) regions[r]=t; }
  return {...s, level:top.level, kind:top.kind||"air", text:(top.text||[top.event,top.area].filter(Boolean).join(" — "))+(sel.length>1?`  (+${sel.length-1} kiti)`:""),
    time:top.time, url:top.url||s.url, src:top.src||s.src, dateOnly:!!top.dateOnly, items:s.items?sel:null,
    regions:Object.keys(regions).length?regions:null, regionsOnly:sel.every(a=>a.regions&&a.regions.length)};
}
function renderCards(){
  const box=document.getElementById("cards");
  const list=COUNTRIES.filter(c=>!c.hidden).sort((a,b)=>ORDER[V(a.id).level]-ORDER[V(b.id).level]);
  box.innerHTML=list.map(c=>{const s=V(c.id);
    const t=!s.time?"—":s.dateOnly?new Date(s.time).toLocaleDateString("lt-LT",{month:"2-digit",day:"2-digit"})+" (laikas nenurodytas)"
      :new Date(s.time).toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"});
    return `<div class="card${selected===c.id?" sel":""}" data-l="${s.level}" data-k="${s.kind||""}" data-id="${c.id}">
      <div class="row"><span class="cc">${c.cc}</span><span class="nm">${c.nm}</span></div>
      <div class="st">${(s.kind&&s.kind!=="air"&&LEVEL_ALT[s.level])||LEVEL_TXT[s.level]}</div>${s.kind?`<div class="kd">${KIND[s.kind]||KIND.other}</div>`:""}
      <div class="ds">${esc(s.text)}</div>
      <div class="mt"><span>${safeUrl(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.src||c.src)}</a>`:esc(s.src||c.src)}</span><span>${esc(t)}</span></div></div>`;}).join("");
  box.querySelectorAll(".card").forEach(el=>el.onclick=()=>select(el.dataset.id,true));
}
function select(id,fromCard){
  selected = selected===id?null:id; renderAlerts(); renderDetail();
  if(selected){ const el=document.querySelector(`.card[data-id="${id}"]`); el&&el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); }
  focusView();
}
// laisvas plotas žemėlapiui: be viršutinės juostos, detalių lango ir kortelių
function freeRect(){
  const w=W(), h=H(), wide=isWide();
  const det=document.getElementById("detail").getBoundingClientRect();
  const cards=document.getElementById("cards").getBoundingClientRect();
  if(wide) return {x0:(selected?det.right:0)+24, y0:70, x1:cards.left-16, y1:h-24};
  const top=selected?det.bottom+12:70;
  return {x0:12, y0:top, x1:w-12, y1:cards.top+10};
}
function focusView(){
  let t=d3.zoomIdentity;
  if(selected){
    const [[x0,y0],[x1,y1]]=path.bounds(SHAPES[selected]), r=freeRect();
    const k=Math.max(.7,Math.min(10,.9*Math.min((r.x1-r.x0)/(x1-x0),(r.y1-r.y0)/(y1-y0))));
    t=d3.zoomIdentity.translate((r.x0+r.x1)/2-k*(x0+x1)/2,(r.y0+r.y1)/2-k*(y0+y1)/2).scale(k);
  }
  svg.transition().duration(700).ease(d3.easeCubicInOut).call(zoom.transform,t);
}


/* ---------- detalių langas ---------- */
const SRC_KEYS = {LTU:["lt72","lrt","meteoalarm-lithuania"],LVA:["lv-nbs","meteoalarm-latvia"],EST:["kriis","meteoalarm-estonia"],
  FIN:["meteoalarm-finland"],POL:["rcb","meteoalarm-poland"],UKR:["ukrainealarm.com","alerts.in.ua","ubilling.net.ua"]};
const SRC_NAME = {"lt72":"lt72.lt (PAGD)","lrt":"LRT (žiniasklaida)","lv-nbs":"NBS · lvportals.lv","kriis":"kriis.ee (EE-ALARM)","rcb":"gov.pl/rcb (Alert RCB)"};
const safeUrl = u => /^https?:\/\//i.test(u||"");
const esc = t => String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => { if(!t) return ""; const d=new Date(t); if(isNaN(d)) return "";
  return d.toLocaleString("lt-LT",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); };
function renderDetail(){
  const box=document.getElementById("detail");
  if(!selected){box.classList.remove("open");return;}
  const c=COUNTRIES.find(x=>x.id===selected), s=V(selected), tn=tone(s);
  box.style.setProperty("--c",`var(--${tn==="none"?"grey":tn})`);
  const status=(!isAir(s)&&LEVEL_ALT[s.level])||LEVEL_TXT[s.level];
  let items="";
  if(s.regions && Object.keys(s.regions).length){
    const byTone={}; for(const [i,t] of Object.entries(s.regions)) (byTone[t]=byTone[t]||[]).push(RSHAPES[i]?RSHAPES[i].properties.name:i);
    items=`<div class="sec">Sritys · ${Object.keys(s.regions).length}</div>`+["red","yellow","teal"].filter(t=>byTone[t]).map(t=>
      `<div class="it" style="--ic:${COLOR[t]}"><span>${byTone[t].sort().map(esc).join(" · ")}</span></div>`).join("");
  }
  if(s.items && s.items.length){
    items+=`<div class="sec">Aktyvūs įspėjimai · ${s.items.length}</div>`+s.items.map(a=>{
      const ic=COLOR[tone(a)]||COLOR.white;
      const when=[a.dateOnly?new Date(a.time).toLocaleDateString("lt-LT",{month:"2-digit",day:"2-digit"})+" (be laiko)":fmt(a.time),
        a.expires?"iki "+fmt(a.expires):""].filter(Boolean).join(" – ");
      return `<div class="it" style="--ic:${ic}"><b>${esc(a.event||(a.kind==="air"?"Oro pavojus":"Įspėjimas"))}</b>`+
        `<span>${esc(a.area||a.text)}</span>`+
        `<i>${esc(KIND[a.kind]||"")}${a.severity?" · "+esc(a.severity):""}${when?" · "+when:""} · ${safeUrl(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(a.src)}</a>`:esc(a.src)}</i></div>`;}).join("");
  }
  const keys=SRC_KEYS[selected]||[], ms=(META&&META.sources)||{};
  const srcs=keys.map(k=>{const m=ms[k], nm=SRC_NAME[k]||k.replace("meteoalarm-","MeteoAlarm · ");
    if(!m) return `<div>· ${esc(nm)} <span style="color:var(--ink2)">— dar netikrinta</span></div>`;
    return m.ok?`<div><span class="ok">✓</span> ${esc(nm)} <span style="color:var(--ink2)">· įspėjimų: ${m.n}</span></div>`
               :`<div><span class="bad">✗</span> ${esc(nm)} <span style="color:var(--ink2)">· ${/nėra [A-Z_]+(KEY|TOKEN)/.test(m.err)?"laukiama API rakto":/403/.test(m.err)?"svetainė blokuoja (403)":esc(String(m.err).slice(0,70))}</span></div>`;}).join("");
  box.innerHTML=`<button class="x" aria-label="Uždaryti">✕</button>
    <h2><span class="cc" style="font-size:10px;letter-spacing:.2em;color:var(--c);border:1px solid var(--c);border-radius:6px;padding:1px 5px">${c.cc}</span>${esc(c.nm)}</h2>
    <div class="st">${status}</div>${s.kind?`<div class="kd">${KIND[s.kind]||KIND.other}</div>`:""}
    <div class="src" style="margin-top:8px">${esc(s.text)}</div>
    ${items}
    <div class="sec">Šaltiniai</div>
    <div class="src">${safeUrl(s.url)?`Pagrindinis: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.src||c.src)}</a>`:`Pagrindinis: ${esc(s.src||c.src)}`}${srcs}
    <div style="color:var(--ink2);margin-top:4px">Tikrinta: ${META&&META.checked?fmt(META.checked):"—"}</div></div>`;
  box.querySelector(".x").onclick=()=>select(selected);
  box.classList.add("open"); box.scrollTop=0;
}

/* ---------- duomenys ---------- */
// Vietinis serveris (Termux / APK) pateikia /alerts.json: {"LTU":{"level":"red","text":"…","time":"ISO"}, …}
// 1) šalia esantis alerts.json (Termux / APK / Pages), 2) tiesiai iš GitHub (greitesnis nei Pages kešas)
const RAW="https://raw.githubusercontent.com/arturas098/air-alert-map/data/alerts.json";   // šaka „data“ – pildo GitHub Actions
const DATA_URLS = location.hostname.endsWith("github.io") ? [RAW,"alerts.json"] : ["alerts.json",RAW];
let META=null;
async function poll(){
  if(demoIdx>=0) return;
  try{
    let j=null;
    for(const u of DATA_URLS){ try{ const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"}); if(r.ok){ j=await r.json(); break; } }catch(e){} }
    if(!j) throw 0;
    STATE=structuredClone(BASE); for(const k in j) if(STATE[k]) STATE[k]={...STATE[k],...j[k]};
    META=j._meta||null; setLive(true); renderAlerts(); renderDetail(); checkRise();
  }catch(e){ setLive(false); }
}
function setLive(on){
  const t=on&&META&&META.checked?new Date(META.checked):new Date();
  const ago=Math.round((Date.now()-t)/60000), stale=on&&ago>20;
  document.getElementById("live").classList.toggle("live",on&&!stale);
  document.getElementById("live").classList.toggle("stale",stale);
  document.getElementById("src").textContent=!on?"offline":stale?"pasenę":"live";
  document.getElementById("upd").classList.toggle("warn",stale);
  document.body.classList.toggle("stale",on&&ago>30);
  document.getElementById("upd").textContent=on?`${stale?"⚠ duomenys pasenę · ":""}tikrinta ${t.toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"})} · prieš ${ago} min`:"nėra ryšio su duomenimis";
}
document.getElementById("demo").onclick=e=>{
  demoIdx = demoIdx+1>=DEMOS.length?-1:demoIdx+1;
  e.target.classList.toggle("on",demoIdx>=0); e.target.textContent=demoIdx>=0?`Demo ${demoIdx+1}/${DEMOS.length}`:"Demo";
  STATE=structuredClone(BASE);
  if(demoIdx>=0){const now=new Date().toISOString();for(const k in DEMOS[demoIdx])STATE[k]={...DEMOS[demoIdx][k],time:now};
    document.getElementById("upd").textContent="demonstraciniai duomenys";}
  else poll();
  renderAlerts(); renderDetail();
};

/* ---------- sluoksnių jungiklis ---------- */
function setLayer(l){ LAYER=l; try{localStorage.setItem("layer",l);}catch(e){}
  document.querySelectorAll("#layers button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  renderAlerts(); renderDetail(); }
document.querySelectorAll("#layers button").forEach(b=>b.onclick=()=>setLayer(b.dataset.l));

/* ---------- garsas / pranešimas apie naują oro pavojų ---------- */
// 🔕 → 🔔 LT → 🔔 visos (be Ukrainos, kur pavojus beveik nuolatinis) → 🔕
const BELL_MODES=["off","LTU","all"]; let BELL="off", PREV={}, actx=null;
try{ BELL=localStorage.getItem("bell")||"off"; }catch(e){}
function bellLabel(){ const b=document.getElementById("bell");
  b.textContent=BELL==="off"?"🔕":BELL==="LTU"?"🔔 LT":"🔔 visos"; b.classList.toggle("on",BELL!=="off"); }
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,0.35].forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.type="sine";
    g.gain.setValueAtTime(.0001,actx.currentTime+dt);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+dt+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dt+.3);o.connect(g).connect(actx.destination);o.start(actx.currentTime+dt);o.stop(actx.currentTime+dt+.32);});
  }catch(e){} }
document.getElementById("bell").onclick=()=>{
  BELL=BELL_MODES[(BELL_MODES.indexOf(BELL)+1)%BELL_MODES.length]; try{localStorage.setItem("bell",BELL);}catch(e){}
  bellLabel(); if(BELL!=="off"){ beep(); try{ if(window.Notification&&Notification.permission==="default") Notification.requestPermission(); }catch(e){} }
};
// kviečiama po kiekvieno duomenų atnaujinimo: ar kurios nors šalies ORO PAVOJUS pakilo?
function checkRise(){
  if(demoIdx>=0) return;
  const air=id=>{ const s=STATE[id]; const its=s.items||((s.level==="red"||s.level==="yellow")&&(s.kind||"air")==="air"?[s]:[]);
    return its.filter(a=>(a.kind||"air")==="air").reduce((m,a)=>Math.max(m,RANKL[a.level]||0),0); };
  const watch = BELL==="LTU" ? ["LTU"] : COUNTRIES.filter(c=>!c.hidden&&c.id!=="UKR").map(c=>c.id);
  const first = !Object.keys(PREV).length; const rose=[];
  for(const c of COUNTRIES){ const v=air(c.id); if(!first && BELL!=="off" && watch.includes(c.id) && v>=2 && v>(PREV[c.id]||0)) rose.push(c); PREV[c.id]=v; }
  if(rose.length){ beep(); const msg=rose.map(c=>`${c.nm}: ${LEVEL_TXT[V(c.id).level]||""}`).join(", ");
    try{ if(window.Notification&&Notification.permission==="granted") new Notification("Oro pavojus · Baltija",{body:msg}); }catch(e){} }
}

/* ---------- zoom ---------- */
const zoom=d3.zoom().scaleExtent([.7,14]).on("zoom",ev=>onZoom(ev.transform));
// neleidžiam nuvažiuoti už duomenų ribų (ten tik tuščias juodas fonas)
function limitZoom(){ const [[x0,y0],[x1,y1]]=path.bounds(land);
  const kmin=Math.max(W()/(x1-x0),H()/(y1-y0));
  zoom.translateExtent([[x0,y0],[x1,y1]]).scaleExtent([Math.min(1,kmin),14]); }
svg.call(zoom).on("dblclick.zoom",null);
addEventListener("resize",()=>{clearTimeout(window._r);window._r=setTimeout(()=>{draw();svg.call(zoom.transform,d3.zoomIdentity);renderBase(d3.zoomIdentity);},150)});
setLayer(LAYER); bellLabel();
draw(); svg.call(zoom.transform,d3.zoomIdentity); renderBase(d3.zoomIdentity); poll(); setInterval(poll,60000);
</script>
